name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner ships an Android SDK but its licenses are not accepted, and
      # android-actions/setup-android fails on the preinstalled sdkmanager version.
      # Accept them directly and install exactly the platform this build needs.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | sort | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > baseline-android/local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          echo "build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true

      # The signing key must stay the same between builds, otherwise every new APK
      # has a different signature and the phone demands an uninstall first.
      # Caching it keeps upgrades installable in place.
      - name: Restore signing key
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create signing key if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('baseline-android/**/*.gradle.kts', 'baseline-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Unit tests
        working-directory: baseline-android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build APK
        working-directory: baseline-android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect APK
        run: |
          mkdir -p out
          cp baseline-android/app/build/outputs/apk/release/app-release.apk \
             "out/baseline-${{ github.run_number }}.apk"
          ls -la out

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 90

      # A release asset is the one thing downloadable straight onto a phone
      # without a GitHub session, so keep a single rolling "latest" release.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "out/baseline-${{ github.run_number }}.apk" \
            --title "Latest APK" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA:0:7}.

          Install: download the APK on your phone, open it, and allow installing from this source when prompted."
